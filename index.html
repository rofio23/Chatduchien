
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b1e">

    <title>Fortnite | Chatduchien</title>

    <link rel="icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-glow"></div>

    <main class="container">
        <div class="card">

            <img
                src="logo.png"
                alt="Logo Fortnite"
                class="logo"
            >

            <h1>Bienvenue !</h1>

            <p class="description">
                Rejoins notre communauté Fortnite
                sur Discord !
            </p>

            <a
                href="https://discord.gg/FBjhEdxTy"
                target="_blank"
                rel="noopener noreferrer"
                class="discord-btn"
            >
                Rejoindre le Discord
            </a>

            <div class="separator"></div>

            <p class="creator">
                Créé par <span>Chatduchien</span>
            </p>

        </div>
    </main>

</body>
</html>
